name: Publish NuGet

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      force_bump:
        description: 'Force a specific bump type (overrides commit detection)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v0.0.0")
          CURRENT="${LAST_TAG#v}"
          echo "Current version (from tag): ${CURRENT}"

          FORCE="${{ github.event.inputs.force_bump }}"
          if [[ -n "$FORCE" && "$FORCE" != "auto" ]]; then
            BUMP="${FORCE}"
            echo "Forced bump type: ${BUMP}"
          else
            if [[ "$LAST_TAG" == "v0.0.0" ]]; then
              COMMIT_RANGE="HEAD"
              echo "No previous tag found — analyzing all commits"
            else
              COMMIT_RANGE="${LAST_TAG}..HEAD"
              echo "Analyzing commits since ${LAST_TAG}"
            fi

            BUMP="patch"
            COMMITS=$(git log --pretty=format:"%s" ${COMMIT_RANGE} 2>/dev/null || git log --pretty=format:"%s" HEAD~10..HEAD)

            echo "Commits to analyze:"
            echo "$COMMITS"

            if echo "$COMMITS" | grep -qiE "^.*!:|BREAKING CHANGE"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qiE "^feat(\(.*\))?:"; then
              BUMP="minor"
            fi

            echo "Detected bump type: ${BUMP}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT}"
          case "$BUMP" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${CURRENT} → ${VERSION} (${BUMP} bump)"

      - name: Check for existing tag
        id: tag_check
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if git rev-parse --verify "refs/tags/${TAG}" > /dev/null 2>&1 \
             || git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists — skipping."
            echo "ALREADY_TAGGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "ALREADY_TAGGED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        if: steps.tag_check.outputs.ALREADY_TAGGED == 'false'
        run: dotnet restore

      - name: Build
        if: steps.tag_check.outputs.ALREADY_TAGGED == 'false'
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        if: steps.tag_check.outputs.ALREADY_TAGGED == 'false'
        run: dotnet test --configuration Release --no-build --verbosity minimal

      - name: Pack
        if: steps.tag_check.outputs.ALREADY_TAGGED == 'false'
        run: |
          dotnet pack src/EggMapper/EggMapper.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./artifacts
          dotnet pack src/EggMapper.Generator/EggMapper.Generator.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./artifacts
          dotnet pack src/EggMapper.ClassMapper/EggMapper.ClassMapper.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./artifacts

      - name: Upload artifacts
        if: steps.tag_check.outputs.ALREADY_TAGGED == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.VERSION }}
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: Push to NuGet.org
        if: steps.tag_check.outputs.ALREADY_TAGGED == 'false'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          if ls ./artifacts/*.snupkg 1>/dev/null 2>&1; then
            dotnet nuget push ./artifacts/*.snupkg \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi

      - name: Create git tag
        if: steps.tag_check.outputs.ALREADY_TAGGED == 'false'
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          if ! git push origin "${TAG}" 2>&1; then
            echo "::warning::Tag ${TAG} was already pushed (likely by a concurrent run). Continuing."
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          fi

      - name: Create GitHub Release
        if: steps.tag_check.outputs.ALREADY_TAGGED == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "::warning::Release ${TAG} already exists. Skipping."
          else
            gh release create "${TAG}" \
              --title "EggMapper ${TAG}" \
              --generate-notes \
              ./artifacts/*.nupkg ./artifacts/*.snupkg
          fi
